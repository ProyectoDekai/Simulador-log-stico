<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Códigos</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    :root {
        --fondo: #f5f1e8;
        --tarjeta: #ffffff;
        --borde: #e5e0d5;
        --texto: #2d3748;
        --texto-suave: #718096;
        --acento: #2b6cb0;
        --rojo: #c53030;
        --rojo-hover: #9b2c2c;
        --verde: #2f855a;
        --radio: 12px;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--fondo);
        min-height: 100vh;
        padding: 24px;
        color: var(--texto);
    }

    .contenedor {
        max-width: 1100px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 20px;
        align-items: start;
    }

    .tarjeta {
        background: var(--tarjeta);
        border-radius: var(--radio);
        border: 1px solid var(--borde);
        padding: 24px;
    }

    h2 {
        font-size: 1.05rem;
        font-weight: 700;
        margin-bottom: 20px;
        color: var(--texto);
    }

    .campo {
        margin-bottom: 20px;
    }

    label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 0.85rem;
        color: var(--texto);
    }

    select,
    textarea,
    input[type="text"] {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--borde);
        border-radius: 8px;
        font-size: 0.95rem;
        font-family: inherit;
        background: #fff;
        color: var(--texto);
        transition: border-color 0.15s;
    }

    select:focus,
    textarea:focus,
    input[type="text"]:focus {
        outline: none;
        border-color: var(--acento);
    }

    textarea {
        height: 120px;
        resize: vertical;
        line-height: 1.4;
    }

    #campoErrorCorrection.oculto {
        display: none;
    }

    /* ===== Campo "Texto visible" ===== */
    #campoTextoVisible.oculto {
        display: none;
    }

    .checkbox-linea {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.85rem;
        color: var(--texto);
        margin-bottom: 0;
        user-select: none;
    }

    .checkbox-linea input[type="checkbox"] {
        width: 16px;
        height: 16px;
        cursor: pointer;
        accent-color: var(--acento);
    }

    #textoVisible {
        margin-top: 10px;
    }

    #textoVisible.oculto {
        display: none;
    }

    .preview-tarjeta {
        display: flex;
        flex-direction: column;
    }

    .preview-header {
        font-size: 1.05rem;
        font-weight: 700;
        margin-bottom: 20px;
    }

    .lienzo {
        border: 1px dashed #cbd5e0;
        border-radius: 8px;
        height: 420px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        overflow: hidden;
        background-color: #ffffff;
        background-image:
            linear-gradient(45deg, #e8e8e8 25%, transparent 25%),
            linear-gradient(-45deg, #e8e8e8 25%, transparent 25%),
            linear-gradient(45deg, transparent 75%, #e8e8e8 75%),
            linear-gradient(-45deg, transparent 75%, #e8e8e8 75%);
        background-size: 20px 20px;
        background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }

    .lienzo svg {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        display: block;
    }

    .aviso-vacio {
        color: var(--texto-suave);
        font-size: 0.9rem;
        text-align: center;
        user-select: none;
    }

    .error {
        background: #fed7d7;
        color: var(--rojo);
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 0.85rem;
        border-left: 4px solid var(--rojo);
        margin-top: 16px;
    }

    .error.oculto {
        display: none;
    }

    .botones {
        display: flex;
        gap: 12px;
        margin-top: 20px;
    }

    button {
        flex: 1;
        padding: 14px 20px;
        border: none;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
        font-family: inherit;
    }

    button:active:not(:disabled) {
        transform: scale(0.98);
    }

    button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }

    .btn-descargar {
        background: var(--rojo);
        color: #fff;
    }

    .btn-descargar:hover:not(:disabled) {
        background: var(--rojo-hover);
    }

    .btn-copiar {
        background: #edf2f7;
        color: var(--texto);
    }

    .btn-copiar:hover:not(:disabled) {
        background: #e2e8f0;
    }

    .btn-copiar.copiado {
        background: var(--verde);
        color: #fff;
    }

    @media (max-width: 820px) {
        .contenedor {
            grid-template-columns: 1fr;
        }
        .lienzo {
            height: 320px;
        }
    }
</style>
</head>
<body>
    <div class="contenedor">
        <!-- Panel de configuración -->
        <div class="tarjeta">
            <h2>Configuración</h2>

            <div class="campo">
                <label for="tipo">Tipo de código</label>
                <select id="tipo">
                    <option value="code128">Code 128 (1D)</option>
                    <option value="qrcode">QR Code (2D)</option>
                    <option value="azteccode">Aztec (2D)</option>
                </select>
            </div>

            <div class="campo">
                <label for="texto">Datos</label>
                <textarea id="texto" placeholder="Escribe aquí el texto a codificar..." spellcheck="false"></textarea>
            </div>

            <!-- Campo "Texto visible" (solo para Code 128) -->
            <div class="campo" id="campoTextoVisible">
                <label class="checkbox-linea">
                    <input type="checkbox" id="chkTextoVisible">
                    Texto personalizado bajo el código
                </label>
                <input type="text" id="textoVisible" class="oculto" placeholder="Texto opcional a mostrar bajo el código" spellcheck="false">
            </div>

            <div class="campo" id="campoErrorCorrection">
                <label for="errorCorrection">Error correction</label>
                <select id="errorCorrection">
                    <option value="L">Low (L)</option>
                    <option value="M" selected>Medium (M)</option>
                    <option value="Q">Quartile (Q)</option>
                    <option value="H">High (H)</option>
                </select>
            </div>
        </div>

        <!-- Panel de preview -->
        <div class="tarjeta preview-tarjeta">
            <div class="preview-header">Preview</div>

            <div class="lienzo" id="lienzo">
                <span class="aviso-vacio" id="avisoVacio">Escribe algo para generar el código</span>
            </div>

            <div class="error oculto" id="mensajeError"></div>

            <div class="botones">
                <button class="btn-descargar" id="btnDescargar" disabled>Descargar SVG</button>
                <button class="btn-copiar" id="btnCopiar" disabled>Copiar SVG</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bwip-js@4.5.4/dist/bwip-js-min.js"></script>
    <script>
        // ==================== Referencias DOM ====================
        const tipoSelect        = document.getElementById('tipo');
        const textoInput        = document.getElementById('texto');

        const campoTextoVisible = document.getElementById('campoTextoVisible');
        const chkTextoVisible   = document.getElementById('chkTextoVisible');
        const textoVisibleInput = document.getElementById('textoVisible');

        const campoErrCorr      = document.getElementById('campoErrorCorrection');
        const errorCorrection   = document.getElementById('errorCorrection');

        const lienzo            = document.getElementById('lienzo');
        const avisoVacio        = document.getElementById('avisoVacio');
        const mensajeError      = document.getElementById('mensajeError');
        const btnDescargar      = document.getElementById('btnDescargar');
        const btnCopiar         = document.getElementById('btnCopiar');

        // ==================== Estado ====================
        let svgActual = null;
        let timeoutGenerar = null;
        let timeoutError = null;

        // ==================== Utilidades ====================

        function ocultarError() {
            clearTimeout(timeoutError);
            mensajeError.textContent = '';
            mensajeError.classList.add('oculto');
        }

        function mostrarErrorDiferido(mensaje) {
            clearTimeout(timeoutError);
            timeoutError = setTimeout(() => {
                mensajeError.textContent = mensaje;
                mensajeError.classList.remove('oculto');
            }, 500);
        }

        function limpiarLienzo() {
            lienzo.innerHTML = '';
            lienzo.appendChild(avisoVacio);
            avisoVacio.style.display = 'block';
        }

        function habilitarBotones(habilitado) {
            btnDescargar.disabled = !habilitado;
            btnCopiar.disabled = !habilitado;
        }

        /**
         * El selector de error correction solo aplica a QR.
         * Se oculta con Code 128 y con Aztec.
         */
        function actualizarVisibilidadErrorCorrection() {
            const tipo = tipoSelect.value;
            if (tipo === 'qrcode') {
                campoErrCorr.classList.remove('oculto');
            } else {
                campoErrCorr.classList.add('oculto');
            }
        }

        /**
         * El campo "Texto visible" solo aplica a Code 128.
         * Al ocultarse (por cambio de tipo), se resetea por completo:
         * checkbox desactivado, input oculto y vacío.
         */
        function actualizarVisibilidadTextoVisible() {
            const tipo = tipoSelect.value;
            if (tipo === 'code128') {
                campoTextoVisible.classList.remove('oculto');
            } else {
                campoTextoVisible.classList.add('oculto');
                // Reset completo (opción b)
                chkTextoVisible.checked = false;
                textoVisibleInput.value = '';
                textoVisibleInput.classList.add('oculto');
            }
        }

        /**
         * Genera un nombre de archivo seguro a partir del tipo y el texto.
         */
        function generarNombreArchivo(tipo, texto) {
            const mapa = { code128: 'code128', qrcode: 'qrcode', azteccode: 'aztec' };
            const prefijo = mapa[tipo] || 'codigo';

            let cuerpo = texto
                .replace(/[\r\n\t ]+/g, '_')
                .replace(/[\\/:*?"<>|]+/g, '_')
                .replace(/_+/g, '_')
                .replace(/^_+|_+$/g, '');

            if (cuerpo.length > 50) {
                cuerpo = cuerpo.slice(0, 50);
            }

            return `${prefijo}_${cuerpo}.svg`;
        }

        // ==================== Generación ====================

        function generarCodigo() {
            ocultarError();

            const tipo = tipoSelect.value;
            const texto = textoInput.value;

            if (!texto.trim()) {
                svgActual = null;
                limpiarLienzo();
                habilitarBotones(false);
                return;
            }

            const opciones = {
                bcid: tipo,
                text: texto,
                scale: 3,
                paddingwidth: 10,
                paddingheight: 10
            };

            if (tipo === 'code128') {
                opciones.includetext = true;
                opciones.textxalign = 'center';
                opciones.height = 10;

                // Texto visible personalizado (alttext) solo si:
                // - el checkbox está activo
                // - hay contenido en el input
                // En caso contrario, bwip-js muestra el texto del dato real.
                const usaTextoVisible = chkTextoVisible.checked && textoVisibleInput.value.trim() !== '';
                if (usaTextoVisible) {
                    opciones.alttext = textoVisibleInput.value;
                }
            }

            // Error correction SOLO aplica a QR.
            // Aztec usa su propio nivel automático.
            if (tipo === 'qrcode') {
                opciones.eclevel = errorCorrection.value;
            }

            let svg;
            try {
                svg = bwipjs.toSVG(opciones);
            } catch (err) {
                console.error('Error bwip-js:', err);
                svgActual = null;
                limpiarLienzo();
                habilitarBotones(false);
                mostrarErrorDiferido('No se pudo generar el código con esos datos.');
                return;
            }

            svgActual = svg;
            lienzo.innerHTML = svg;
            avisoVacio.style.display = 'none';
            habilitarBotones(true);
        }

        function programarGeneracion() {
            clearTimeout(timeoutGenerar);
            timeoutGenerar = setTimeout(generarCodigo, 180);
        }

        // ==================== Descargar ====================

        function descargarSVG() {
            if (!svgActual) return;

            const tipo = tipoSelect.value;
            const texto = textoInput.value;
            const nombre = generarNombreArchivo(tipo, texto);

            const blob = new Blob([svgActual], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const enlace = document.createElement('a');
            enlace.href = url;
            enlace.download = nombre;
            document.body.appendChild(enlace);
            enlace.click();
            document.body.removeChild(enlace);
            URL.revokeObjectURL(url);
        }

        // ==================== Copiar ====================

        async function copiarSVG() {
            if (!svgActual) return;

            try {
                await navigator.clipboard.writeText(svgActual);

                const textoOriginal = btnCopiar.textContent;
                btnCopiar.textContent = '¡Copiado!';
                btnCopiar.classList.add('copiado');

                setTimeout(() => {
                    btnCopiar.textContent = textoOriginal;
                    btnCopiar.classList.remove('copiado');
                }, 1500);
            } catch (err) {
                console.error('Error al copiar:', err);
                mostrarErrorDiferido('No se pudo copiar al portapapeles.');
            }
        }

        // ==================== Event Listeners ====================

        textoInput.addEventListener('input', programarGeneracion);

        tipoSelect.addEventListener('change', () => {
            actualizarVisibilidadErrorCorrection();
            actualizarVisibilidadTextoVisible();
            programarGeneracion();
        });

        errorCorrection.addEventListener('change', programarGeneracion);

        // Checkbox de "Texto visible"
        chkTextoVisible.addEventListener('change', () => {
            if (chkTextoVisible.checked) {
                textoVisibleInput.classList.remove('oculto');
            } else {
                textoVisibleInput.value = '';       // opción a: borrar al desactivar
                textoVisibleInput.classList.add('oculto');
            }
            programarGeneracion();
        });

        // Input de "Texto visible"
        textoVisibleInput.addEventListener('input', programarGeneracion);

        btnDescargar.addEventListener('click', descargarSVG);
        btnCopiar.addEventListener('click', copiarSVG);

        // ==================== Inicialización ====================

        window.addEventListener('DOMContentLoaded', () => {
            actualizarVisibilidadErrorCorrection();
            actualizarVisibilidadTextoVisible();
            limpiarLienzo();
            habilitarBotones(false);
        });
    </script>
</body>
</html>
