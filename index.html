<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Códigos</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    :root {
        --fondo: #0a0a0a;
        --tarjeta: #141414;
        --borde: #2a2a2a;
        --texto: #f0f0f0;
        --texto-suave: #8a8a8a;
        --acento: #f0f0f0;
        --rojo: #c53030;
        --rojo-hover: #9b2c2c;
        --verde: #2f855a;
        --amarillo-fondo: #2a2410;
        --amarillo-texto: #e8d27a;
        --amarillo-borde: #d69e2e;
        --radio: 12px;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--fondo);
        background-image:
            linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px),
            linear-gradient(0deg,  rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        min-height: 100vh;
        padding: 24px;
        color: var(--texto);
    }

    .contenedor {
        max-width: 1100px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 20px;
        align-items: start;
    }

    .tarjeta {
        background: var(--tarjeta);
        border-radius: var(--radio);
        border: 1px solid var(--borde);
        padding: 24px;
        position: relative;
        overflow: hidden;
    }

    .tarjeta::before {
        content: "";
        position: absolute;
        top: -40px;
        right: -40px;
        width: 120px;
        height: 120px;
        background: linear-gradient(135deg, transparent 45%, rgba(255,255,255,0.06) 45%, rgba(255,255,255,0.06) 55%, transparent 55%);
        pointer-events: none;
    }

    .tarjeta::after {
        content: "";
        position: absolute;
        bottom: -40px;
        left: -40px;
        width: 120px;
        height: 120px;
        background: linear-gradient(135deg, transparent 45%, rgba(255,255,255,0.04) 45%, rgba(255,255,255,0.04) 55%, transparent 55%);
        pointer-events: none;
    }

    h2 {
        font-size: 1.05rem;
        font-weight: 700;
        margin-bottom: 20px;
        color: var(--texto);
    }
    h2 a {
        color: inherit;
        text-decoration: none;
        transition: opacity 0.15s;
    }

    h2 a:hover {
        opacity: 0.7;
    }

    .campo {
        margin-bottom: 20px;
        position: relative;
        z-index: 1;
    }

    label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 0.85rem;
        color: var(--texto);
    }

    select,
    textarea,
    input[type="text"],
    input[type="number"] {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--borde);
        border-radius: 8px;
        font-size: 0.95rem;
        font-family: inherit;
        background: #0f0f0f;
        color: var(--texto);
        transition: border-color 0.15s;
    }

    select:focus,
    textarea:focus,
    input[type="text"]:focus,
    input[type="number"]:focus {
        outline: none;
        border-color: var(--texto-suave);
    }

    textarea {
        height: 120px;
        resize: vertical;
        line-height: 1.4;
    }

    .checkbox-linea {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.85rem;
        color: var(--texto);
        margin-bottom: 0;
        user-select: none;
    }

    .checkbox-linea input[type="checkbox"] {
        width: 16px;
        height: 16px;
        cursor: pointer;
        accent-color: var(--texto);
    }

    /* ===== Subpanel altura Code 128 ===== */
    #campoAlturaCode128.oculto {
        display: none;
    }

    .altura-linea {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
    }

    .altura-linea input[type="range"] {
        flex: 1;
        accent-color: var(--texto);
        cursor: pointer;
    }

    .altura-linea input[type="number"] {
        width: 80px;
        flex-shrink: 0;
        padding: 6px 8px;
        font-size: 0.85rem;
        text-align: right;
        font-variant-numeric: tabular-nums;
    }

    .altura-linea .unidad {
        font-size: 0.8rem;
        color: var(--texto-suave);
        flex-shrink: 0;
    }

    /* ===== Checkbox mostrar datos ===== */
    #campoMostrarDatos.oculto {
        display: none;
    }

    .preview-tarjeta {
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
    }

    .preview-tarjeta::before {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        width: 6px;
        height: 100%;
        background: linear-gradient(180deg, transparent, rgba(255,255,255,0.08), transparent);
        pointer-events: none;
    }

    .preview-header {
        font-size: 1.05rem;
        font-weight: 700;
        margin-bottom: 20px;
    }

    .lienzo {
        border: 1px dashed #cbd5e0;
        border-radius: 8px;
        height: 420px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        overflow: hidden;
        background-color: #ffffff;
        background-image:
            linear-gradient(45deg, #e8e8e8 25%, transparent 25%),
            linear-gradient(-45deg, #e8e8e8 25%, transparent 25%),
            linear-gradient(45deg, transparent 75%, #e8e8e8 75%),
            linear-gradient(-45deg, transparent 75%, #e8e8e8 75%);
        background-size: 20px 20px;
        background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }

    .lienzo svg {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        display: block;
    }

    .aviso-vacio {
        color: #999;
        font-size: 0.9rem;
        text-align: center;
        user-select: none;
    }

    .error {
        background: #2a1010;
        color: #f5a5a5;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 0.85rem;
        border-left: 4px solid var(--rojo);
        margin-top: 12px;
    }

    .error.oculto {
        display: none;
    }

    /* ===== Botones de tamaño ===== */
    .size-buttons {
        display: flex;
        gap: 8px;
        margin-top: 20px;
    }

    .size-buttons button {
        flex: 1;
        padding: 10px 12px;
        border: 1px solid var(--borde);
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 600;
        font-family: inherit;
        background: #1a1a1a;
        color: var(--texto-suave);
        cursor: pointer;
        transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .size-buttons button:hover:not(.active) {
        background: #222;
        color: var(--texto);
    }

    .size-buttons button.active {
        background: var(--rojo);
        color: #fff;
        border-color: var(--rojo-hover);
    }

    .botones {
        display: flex;
        gap: 12px;
        margin-top: 12px;
    }

    button:not(.btn-restaurar):not(.size-buttons button) {
        flex: 1;
        padding: 14px 20px;
        border: none;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
        font-family: inherit;
    }

    button:not(.btn-restaurar):not(.size-buttons button):active:not(:disabled) {
        transform: scale(0.98);
    }

    button:not(.btn-restaurar):not(.size-buttons button):disabled {
        opacity: 0.3;
        cursor: not-allowed;
    }

    .btn-descargar {
        background: var(--rojo);
        color: #fff;
    }

    .btn-descargar:hover:not(:disabled) {
        background: var(--rojo-hover);
    }

    .btn-png {
        background: #1f1f1f;
        color: var(--texto);
    }

    .btn-png:hover:not(:disabled) {
        background: #2a2a2a;
    }

    /* ===== Popup PNG ===== */
    .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.6);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1200;
        padding: 20px;
    }

    .overlay.visible {
        display: flex;
    }

    .popup {
        background: #0f0f0f;
        border: 1px solid var(--borde);
        border-radius: 12px;
        width: 960px;
        height: 620px;
        max-width: calc(100vw - 40px);
        max-height: calc(100vh - 40px);
        color: var(--texto);
        padding: 18px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .popup-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
        flex-shrink: 0;
    }

    .popup-body {
        display: flex;
        gap: 16px;
        align-items: stretch;
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
    }

    .preview-area {
        background-color: #ffffff;
        background-image:
            linear-gradient(45deg, #e8e8e8 25%, transparent 25%),
            linear-gradient(-45deg, #e8e8e8 25%, transparent 25%),
            linear-gradient(45deg, transparent 75%, #e8e8e8 75%),
            linear-gradient(-45deg, transparent 75%, #e8e8e8 75%);
        background-size: 20px 20px;
        background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        border-radius: 8px;
        padding: 12px;
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px dashed #cbd5e0;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
    }

    .preview-area img {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        object-fit: contain;
        display: block;
    }

    .popup-controls {
        width: 220px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow-y: auto;
    }

    .popup-controls .size-buttons {
        margin-top: 0;
    }

    .popup-controls .size-buttons button {
        padding: 8px 10px;
        font-size: 0.9rem;
    }

    .dimensiones {
        font-size: 0.9rem;
        color: var(--texto-suave);
    }

    .dimensiones .resolucion {
        display: block;
        font-size: 1.4rem;
        font-weight: 700;
        color: var(--texto);
        margin-top: 4px;
    }

    .dimensiones .dpi {
        display: block;
        font-size: 0.75rem;
        color: var(--texto-suave);
        margin-top: 2px;
    }

    .popup-footer {
        display: flex;
        gap: 8px;
        margin-top: auto;
        justify-content: flex-end;
    }

    .close-btn {
        background: transparent;
        border: none;
        color: var(--texto-suave);
        font-weight: 700;
        cursor: pointer;
    }

    @media (max-width: 820px) {
        .contenedor {
            grid-template-columns: 1fr;
        }
        .lienzo {
            height: 320px;
        }
        .popup {
            width: calc(100vw - 24px);
            height: calc(100vh - 24px);
            padding: 14px;
        }
        .popup-body { flex-direction: column; }
        .popup-controls { width: 100%; }
    }
</style>
</head>
<body>
    <div class="contenedor">
        <!-- Panel de configuración -->
        <div class="tarjeta">
            <h2><a href="https://www.instagram.com/proyecto_dekai/" target="_blank" rel="noopener noreferrer">@Proyecto_Dekai</a></h2>

            <div class="campo">
                <label for="tipo">Tipo de código</label>
                <select id="tipo">
                    <option value="code128">Code 128 (1D)</option>
                    <option value="qrcode">QR Code (2D)</option>
                    <option value="azteccode">Aztec (2D)</option>
                </select>
            </div>

            <div class="campo">
                <label for="texto">Datos</label>
                <textarea id="texto" placeholder="Escribe aquí el texto a codificar..." spellcheck="false"></textarea>
            </div>

            <!-- Altura personalizada para Code 128 -->
            <div class="campo" id="campoAlturaCode128">
                <label class="checkbox-linea">
                    <input type="checkbox" id="chkAlturaCode128">
                    Ajustar altura del Code 128
                </label>
                <div class="altura-linea" id="lineaAlturaCode128">
                    <input type="range" id="sliderAltura" min="5" max="80" value="80" step="1">
                    <input type="number" id="inputAltura" min="5" max="80" value="80" step="1">
                    <span class="unidad">mm</span>
                </div>
            </div>

            <!-- Mostrar datos bajo el código (solo Code 128) -->
            <div class="campo" id="campoMostrarDatos">
                <label class="checkbox-linea">
                    <input type="checkbox" id="chkMostrarDatos">
                    Mostrar datos
                </label>
            </div>
        </div>

        <!-- Panel de preview -->
        <div class="tarjeta preview-tarjeta">
            <div class="preview-header">Preview</div>

            <div class="lienzo" id="lienzo">
                <span class="aviso-vacio" id="avisoVacio">Escribe algo para generar el código</span>
            </div>

            <div class="error oculto" id="mensajeError"></div>

            <!-- Botones de tamaño de exportación -->
            <div class="size-buttons">
                <button data-size="small" id="btnSizeSmall" class="active">Pequeño</button>
                <button data-size="medium" id="btnSizeMedium">Mediano</button>
                <button data-size="large" id="btnSizeLarge">Grande</button>
            </div>

            <div class="botones">
                <button class="btn-descargar" id="btnDescargar" disabled>Descargar SVG</button>
                <button class="btn-png" id="btnPng" disabled>Exportar PNG</button>
            </div>
        </div>
    </div>

    <!-- Popup preview PNG -->
    <div class="overlay" id="overlay">
        <div class="popup" role="dialog" aria-hidden="true">
            <div class="popup-header">
                <div style="font-weight:700">Vista previa PNG</div>
                <div>
                    <button class="close-btn" id="btnCerrarPopup">Cerrar ✕</button>
                </div>
            </div>
            <div class="popup-body">
                <div class="preview-area" id="previewArea">
                    <img id="previewImg" alt="Preview PNG">
                </div>
                <div class="popup-controls">
                    <div style="font-weight:700">Tamaño</div>
                    <div class="size-buttons">
                        <button data-size="small" id="btnSmall">Pequeño</button>
                        <button data-size="medium" id="btnMedium">Mediano</button>
                        <button data-size="large" id="btnLarge">Grande</button>
                    </div>

                    <div class="dimensiones" id="dimensionesTexto">—</div>

                    <div class="popup-footer">
                        <button class="btn-descargar" id="btnDescargarPng">Descargar PNG</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bwip-js@4.5.4/dist/bwip-js-min.js"></script>
    <script>
        // ==================== Referencias DOM ====================
        const tipoSelect        = document.getElementById('tipo');
        const textoInput        = document.getElementById('texto');

        const campoAltura128    = document.getElementById('campoAlturaCode128');
        const chkAltura128      = document.getElementById('chkAlturaCode128');
        const sliderAltura      = document.getElementById('sliderAltura');
        const inputAltura       = document.getElementById('inputAltura');
        const lineaAltura128    = document.getElementById('lineaAlturaCode128');

        const campoMostrarDatos = document.getElementById('campoMostrarDatos');
        const chkMostrarDatos   = document.getElementById('chkMostrarDatos');

        const lienzo            = document.getElementById('lienzo');
        const avisoVacio        = document.getElementById('avisoVacio');
        const mensajeError      = document.getElementById('mensajeError');
        const btnDescargar      = document.getElementById('btnDescargar');
        const btnPng            = document.getElementById('btnPng');

        const btnSizeSmall      = document.getElementById('btnSizeSmall');
        const btnSizeMedium     = document.getElementById('btnSizeMedium');
        const btnSizeLarge      = document.getElementById('btnSizeLarge');

        const overlay           = document.getElementById('overlay');
        const previewImg        = document.getElementById('previewImg');
        const btnCerrarPopup    = document.getElementById('btnCerrarPopup');
        const btnSmall          = document.getElementById('btnSmall');
        const btnMedium         = document.getElementById('btnMedium');
        const btnLarge          = document.getElementById('btnLarge');
        const dimensionesTexto  = document.getElementById('dimensionesTexto');
        const btnDescargarPng   = document.getElementById('btnDescargarPng');

        // ==================== Constantes ====================
        const SCALES = {
            small: 2,
            medium: 4,
            large: 6
        };

        // Altura por defecto para Code 128 en mm (80 mm -> height 20)
        const ALTURA_128_DEFAULT_MM = 80;

        const PNG_SIZES = {
            small: 300,
            medium: 600,
            large: 1200
        };

        const DPI_REF = 300;

        // ==================== Estado ====================
        let svgActual = null;
        let timeoutGenerar = null;
        let timeoutError = null;
        let currentPngDataUrl = null;
        let currentScale = 'small';

        // ==================== Utilidades ====================
        function ocultarError() {
            clearTimeout(timeoutError);
            mensajeError.textContent = '';
            mensajeError.classList.add('oculto');
        }

        function mostrarErrorDiferido(mensaje) {
            clearTimeout(timeoutError);
            timeoutError = setTimeout(() => {
                mensajeError.textContent = mensaje;
                mensajeError.classList.remove('oculto');
            }, 500);
        }

        function limpiarLienzo() {
            lienzo.innerHTML = '';
            lienzo.appendChild(avisoVacio);
            avisoVacio.style.display = 'block';
        }

        function habilitarBotones(habilitado) {
            btnDescargar.disabled = !habilitado;
            btnPng.disabled = !habilitado;
        }

        // ==================== Visibilidad de campos ====================
        function actualizarVisibilidadAltura() {
            if (tipoSelect.value === 'code128') {
                campoAltura128.classList.remove('oculto');
                campoMostrarDatos.classList.remove('oculto');
            } else {
                campoAltura128.classList.add('oculto');
                campoMostrarDatos.classList.add('oculto');
                chkAltura128.checked = false;
                sliderAltura.value = ALTURA_128_DEFAULT_MM;
                inputAltura.value = ALTURA_128_DEFAULT_MM;
                actualizarVisibilidadLineaAltura();
            }
        }

        function actualizarVisibilidadLineaAltura() {
            if (chkAltura128.checked) {
                lineaAltura128.style.display = 'flex';
            } else {
                lineaAltura128.style.display = 'none';
            }
        }

        // ==================== Botones de tamaño ====================
        function setScale(sizeKey) {
            currentScale = sizeKey;
            [btnSizeSmall, btnSizeMedium, btnSizeLarge].forEach(b => b.classList.remove('active'));
            if (sizeKey === 'small') btnSizeSmall.classList.add('active');
            if (sizeKey === 'medium') btnSizeMedium.classList.add('active');
            if (sizeKey === 'large') btnSizeLarge.classList.add('active');
            programarGeneracion();
        }

        // ==================== Generación ====================
        function generarNombreArchivo(tipo, texto, ext='svg') {
            const mapa = { code128: 'code128', qrcode: 'qrcode', azteccode: 'aztec' };
            const prefijo = mapa[tipo] || 'codigo';

            let cuerpo = texto
                .replace(/[\r\n\t ]+/g, '_')
                .replace(/[\\/:*?"<>|]+/g, '_')
                .replace(/_+/g, '_')
                .replace(/^_+|_+$/g, '');

            if (cuerpo.length > 50) {
                cuerpo = cuerpo.slice(0, 50);
            }

            return `${prefijo}_${cuerpo}.${ext}`;
        }

        function svgDimensions(svgString) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(svgString, 'image/svg+xml');
            const svgEl = doc.documentElement;

            let width = parseFloat(svgEl.getAttribute('width')) || NaN;
            let height = parseFloat(svgEl.getAttribute('height')) || NaN;
            const viewBox = svgEl.getAttribute('viewBox');
            if ((isNaN(width) || isNaN(height)) && viewBox) {
                const partes = viewBox.split(/\s+/);
                if (partes.length === 4) {
                    width = parseFloat(partes[2]);
                    height = parseFloat(partes[3]);
                }
            }

            if (!isFinite(width) || !isFinite(height) || width <= 0 || height <= 0) {
                width = 300;
                height = 300;
            }

            return { width, height };
        }

        function renderSvgToPng(svgString, targetWidth) {
            return new Promise((resolve, reject) => {
                const dims = svgDimensions(svgString);
                const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(svgBlob);
                const img = new Image();
                img.onload = () => {
                    try {
                        const scale = targetWidth / dims.width;
                        const canvas = document.createElement('canvas');
                        canvas.width = Math.round(dims.width * scale);
                        canvas.height = Math.round(dims.height * scale);
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const dataUrl = canvas.toDataURL('image/png');
                        URL.revokeObjectURL(url);
                        resolve({ dataUrl, width: canvas.width, height: canvas.height });
                    } catch (err) {
                        URL.revokeObjectURL(url);
                        reject(err);
                    }
                };
                img.onerror = (e) => {
                    URL.revokeObjectURL(url);
                    reject(new Error('No se pudo cargar la imagen SVG para rasterizar'));
                };
                img.crossOrigin = 'anonymous';
                img.src = url;
            });
        }

        async function generarCodigo() {
            ocultarError();

            const tipo = tipoSelect.value;
            const texto = textoInput.value;

            if (!texto.trim()) {
                svgActual = null;
                limpiarLienzo();
                habilitarBotones(false);
                return;
            }

            const opciones = {
                bcid: tipo,
                text: texto,
                scale: SCALES[currentScale],
                paddingwidth: 0,
                paddingheight: 0
            };

            if (tipo === 'code128') {
                opciones.textxalign = 'center';
                // El texto bajo el código solo si el checkbox está activo
                opciones.includetext = chkMostrarDatos.checked;

                if (chkAltura128.checked) {
                    const alturaMM = parseFloat(inputAltura.value) || ALTURA_128_DEFAULT_MM;
                    opciones.height = Math.max(5, Math.round(alturaMM / 4));
                } else {
                    opciones.height = 20;
                }
            }

            if (tipo === 'qrcode') {
                opciones.eclevel = 'H';
            }

            let svg;
            try {
                svg = bwipjs.toSVG(opciones);
            } catch (err) {
                console.error('Error bwip-js:', err);
                svgActual = null;
                limpiarLienzo();
                habilitarBotones(false);
                mostrarErrorDiferido('No se pudo generar el código con esos datos.');
                return;
            }

            svgActual = svg;
            lienzo.innerHTML = svg;
            avisoVacio.style.display = 'none';
            habilitarBotones(true);
        }

        function programarGeneracion() {
            clearTimeout(timeoutGenerar);
            timeoutGenerar = setTimeout(generarCodigo, 180);
        }

        // ==================== Descargar SVG ====================
        function descargarSVG() {
            if (!svgActual) return;

            const tipo = tipoSelect.value;
            const texto = textoInput.value;
            const nombre = generarNombreArchivo(tipo, texto, 'svg');

            const blob = new Blob([svgActual], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const enlace = document.createElement('a');
            enlace.href = url;
            enlace.download = nombre;
            document.body.appendChild(enlace);
            enlace.click();
            document.body.removeChild(enlace);
            URL.revokeObjectURL(url);
        }

        // ==================== Popup PNG ====================
        function abrirPopupPng() {
            if (!svgActual) return;
            overlay.classList.add('visible');
            overlay.querySelector('.popup').setAttribute('aria-hidden', 'false');

            [btnSmall, btnMedium, btnLarge].forEach(b => b.classList.remove('active'));
            if (currentScale === 'small') btnSmall.classList.add('active');
            if (currentScale === 'medium') btnMedium.classList.add('active');
            if (currentScale === 'large') btnLarge.classList.add('active');

            setPngSize(currentScale);
        }

        function cerrarPopupPng() {
            overlay.classList.remove('visible');
            overlay.querySelector('.popup').setAttribute('aria-hidden', 'true');
            previewImg.src = '';
            currentPngDataUrl = null;
        }

        async function setPngSize(sizeKey) {
            if (!svgActual) return;

            [btnSmall, btnMedium, btnLarge].forEach(b => b.classList.remove('active'));
            if (sizeKey === 'small') btnSmall.classList.add('active');
            if (sizeKey === 'medium') btnMedium.classList.add('active');
            if (sizeKey === 'large') btnLarge.classList.add('active');

            currentScale = sizeKey;
            [btnSizeSmall, btnSizeMedium, btnSizeLarge].forEach(b => b.classList.remove('active'));
            if (sizeKey === 'small') btnSizeSmall.classList.add('active');
            if (sizeKey === 'medium') btnSizeMedium.classList.add('active');
            if (sizeKey === 'large') btnSizeLarge.classList.add('active');

            const targetWidth = PNG_SIZES[sizeKey];
            try {
                const res = await renderSvgToPng(svgActual, targetWidth);
                currentPngDataUrl = res.dataUrl;
                previewImg.src = res.dataUrl;

                const cmAncho = (res.width / DPI_REF * 2.54).toFixed(1);
                const cmAlto  = (res.height / DPI_REF * 2.54).toFixed(1);

                dimensionesTexto.innerHTML =
                    `Resolución de descarga:` +
                    `<span class="resolucion">${res.width} × ${res.height} px</span>` +
                    `<span class="dpi">≈ ${cmAncho} × ${cmAlto} cm a ${DPI_REF} DPI (impresión)</span>`;
            } catch (err) {
                console.error('Error generando PNG:', err);
                mostrarErrorDiferido('No se pudo generar la vista previa PNG.');
            }
        }

        function descargarPngActual() {
            if (!currentPngDataUrl || !svgActual) return;
            const tipo = tipoSelect.value;
            const texto = textoInput.value;
            const nombre = generarNombreArchivo(tipo, texto, 'png');

            const enlace = document.createElement('a');
            enlace.href = currentPngDataUrl;
            enlace.download = nombre;
            document.body.appendChild(enlace);
            enlace.click();
            document.body.removeChild(enlace);
        }

        // ==================== Event Listeners ====================
        textoInput.addEventListener('input', programarGeneracion);

        tipoSelect.addEventListener('change', () => {
            actualizarVisibilidadAltura();
            programarGeneracion();
        });

        chkAltura128.addEventListener('change', () => {
            actualizarVisibilidadLineaAltura();
            programarGeneracion();
        });

        chkMostrarDatos.addEventListener('change', programarGeneracion);

        sliderAltura.addEventListener('input', () => {
            inputAltura.value = sliderAltura.value;
            programarGeneracion();
        });

        inputAltura.addEventListener('input', () => {
            let v = parseFloat(inputAltura.value);
            if (!isFinite(v)) v = ALTURA_128_DEFAULT_MM;
            v = Math.max(5, Math.min(80, Math.round(v)));
            sliderAltura.value = v;
            programarGeneracion();
        });

        inputAltura.addEventListener('blur', () => {
            let v = parseFloat(inputAltura.value);
            if (!isFinite(v)) v = ALTURA_128_DEFAULT_MM;
            v = Math.max(5, Math.min(80, Math.round(v)));
            inputAltura.value = v;
            sliderAltura.value = v;
        });

        btnDescargar.addEventListener('click', descargarSVG);
        btnPng.addEventListener('click', abrirPopupPng);

        btnSizeSmall.addEventListener('click', () => setScale('small'));
        btnSizeMedium.addEventListener('click', () => setScale('medium'));
        btnSizeLarge.addEventListener('click', () => setScale('large'));

        btnCerrarPopup.addEventListener('click', cerrarPopupPng);
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) cerrarPopupPng();
        });

        btnSmall.addEventListener('click', () => setPngSize('small'));
        btnMedium.addEventListener('click', () => setPngSize('medium'));
        btnLarge.addEventListener('click', () => setPngSize('large'));

        btnDescargarPng.addEventListener('click', descargarPngActual);

        // ==================== Inicialización ====================
        window.addEventListener('DOMContentLoaded', () => {
            actualizarVisibilidadAltura();
            actualizarVisibilidadLineaAltura();
            limpiarLienzo();
            habilitarBotones(false);
        });
    </script>
</body>
</html>
